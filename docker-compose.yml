services:
  mock-server:
    build: ./mock-server
    environment:
      HTTP_ADDR: ":8090"
      POLL_MIN_DELAY: "200ms"
      POLL_MAX_DELAY: "500ms"
      POLL_MAX_WAIT: "30s"
    ports:
      - "8090:8090"
    networks:
      - cluster

  node1:
    build: ./app
    hostname: node1
    environment:
      RAFT_PEERS: "node1=node1:7000,node2=node2:7000,node3=node3:7000"
      MOCK_SERVER_URL: "http://mock-server:8090/poll"
      POLL_WORKERS: "2"
      WAL_PATH: "/data/wal.db"
    volumes:
      - wal-node1:/data
    depends_on:
      - mock-server
    ports:
      - "8081:8080"
    networks:
      - cluster

  node2:
    build: ./app
    hostname: node2
    environment:
      RAFT_PEERS: "node1=node1:7000,node2=node2:7000,node3=node3:7000"
      MOCK_SERVER_URL: "http://mock-server:8090/poll"
      POLL_WORKERS: "2"
      WAL_PATH: "/data/wal.db"
    volumes:
      - wal-node2:/data
    depends_on:
      - mock-server
    ports:
      - "8082:8080"
    networks:
      - cluster

  node3:
    build: ./app
    hostname: node3
    environment:
      RAFT_PEERS: "node1=node1:7000,node2=node2:7000,node3=node3:7000"
      MOCK_SERVER_URL: "http://mock-server:8090/poll"
      POLL_WORKERS: "2"
      WAL_PATH: "/data/wal.db"
    volumes:
      - wal-node3:/data
    depends_on:
      - mock-server
    ports:
      - "8083:8080"
    networks:
      - cluster

networks:
  cluster:
    driver: bridge

volumes:
  wal-node1:
  wal-node2:
  wal-node3:
